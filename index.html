<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎮 بازی ردیاب ترکیبی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- این کتابخانه برای اتصال مستقیم گوشی‌ها به هم است -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
:root{--bg:#0b0a17;--sf:#1a1735;--sf2:#221e45;--tx:#f2f0ff;--mt:#9d99c4;--ln:#2e2a58;--ac:#7c5cff;--ac2:#ff5ca8;--ok:#4fd1a1;--wn:#ffb45c;--dn:#ff5c5c;--gd:#ffd700}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif;height:100vh;width:100vw;overflow:hidden}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;z-index:100}
.screen.show{display:flex}

/* لابی */
#lobby{background:radial-gradient(circle at 50% 30%,#1a1735 0%,#0b0a17 80%);padding:20px;align-items:center;justify-content:center}
.logo{font-size:56px;text-align:center;animation:float 3s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:24px;font-weight:900;text-align:center;margin:8px 0;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mt);font-size:13px;text-align:center;margin-bottom:20px}
.box{background:rgba(255,255,255,.05);border:1.5px solid var(--ln);border-radius:20px;padding:20px;width:100%;max-width:400px;backdrop-filter:blur(10px)}
label.lb{display:block;font-size:12px;color:var(--mt);margin-bottom:6px;font-weight:600;text-align:right}
input{width:100%;padding:13px;border-radius:12px;background:rgba(0,0,0,.3);border:1.5px solid var(--ln);color:#fff;font:inherit;font-size:15px;outline:none;margin-bottom:12px;text-align:center;transition:.2s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
.emojis{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.em{font-size:22px;background:rgba(0,0,0,.3);border:1.5px solid var(--ln);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.em.sel{background:rgba(124,92,255,.35);border-color:var(--ac);transform:scale(1.1)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;cursor:pointer;font:inherit;font-weight:800;font-size:15px;color:#fff;transition:.15s;background:linear-gradient(135deg,var(--ac),var(--ac2));margin-bottom:10px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:transparent;border:1.5px solid var(--ln);color:var(--tx)}
.btn.gold{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#3d2a00}
.btn.dn{background:linear-gradient(135deg,#ff5c5c,#c92c2c)}

.room-code{font-size:44px;font-weight:900;text-align:center;letter-spacing:8px;color:var(--gd);background:rgba(255,215,0,.08);padding:18px;border-radius:16px;border:2px dashed var(--gd);margin:12px 0;font-family:monospace;direction:ltr}
.players-lobby{display:flex;flex-direction:column;gap:8px;margin:14px 0;max-height:200px;overflow-y:auto}
.p-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf2);border-radius:12px;border:1.5px solid var(--ln)}
.p-item .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));flex-shrink:0}
.p-item .nm{flex:1;font-weight:700;font-size:14px;text-align:right}
.p-item.host{border-color:var(--gd)}

/* بازی */
#game{padding:0;background:var(--bg)}
#map{position:absolute;inset:0;z-index:1}
.hud-top{position:absolute;top:12px;left:12px;right:12px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.hb{background:rgba(26,23,53,.92);backdrop-filter:blur(10px);border:1.5px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.hb.tm{color:var(--gd);font-family:monospace;font-size:15px;letter-spacing:1px}
.hb.wolf{background:linear-gradient(135deg,#ff5c5c,#c92c2c);color:#fff;border-color:#ff5c5c}
.hb.lamb{background:linear-gradient(135deg,#4fd1a1,#2b8a6f);color:#fff;border-color:#4fd1a1}

.p-list{position:absolute;bottom:12px;left:12px;right:12px;z-index:10;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.p-list::-webkit-scrollbar{display:none}
.p-card{flex-shrink:0;background:rgba(26,23,53,.92);backdrop-filter:blur(12px);border:1.5px solid var(--ln);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;min-width:130px;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:.2s}
.p-card.me{border-color:var(--ac);background:rgba(124,92,255,.2)}
.p-card.caught{opacity:.4;border-color:var(--dn)}
.p-card .ic{font-size:22px}
.p-card .in{flex:1;min-width:0}
.p-card .nn{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-card .ds{font-size:10px;color:var(--mt);margin-top:2px}

.floating{position:absolute;right:12px;bottom:90px;z-index:10;display:flex;flex-direction:column;gap:8px}
.fbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ln);cursor:pointer;background:rgba(26,23,53,.92);backdrop-filter:blur(10px);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.fbtn:active{transform:scale(.9)}

/* مارکرها */
.mk{font-size:26px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.mk-me{width:18px;height:18px;border-radius:50%;background:var(--ac);border:3px solid #fff;box-shadow:0 0 0 4px rgba(124,92,255,.3);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,92,255,.6)}70%{box-shadow:0 0 0 14px rgba(124,92,255,0)}100%{box-shadow:0 0 0 0 rgba(124,92,255,0)}}

.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-150px);background:rgba(26,23,53,.98);border:1.5px solid var(--ln);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:9999;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}
.loading{position:fixed;inset:0;background:rgba(11,10,23,.95);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading.show{display:flex}
.spin{width:40px;height:40px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ لابی ============ -->
<div id="lobby" class="screen show">
  <div class="logo">🎮</div>
  <h1>بازی ردیاب ترکیبی</h1>
  <p class="sub">با موقعیت مکانی واقعی و اتصال مستقیم<br>۲ تا ۱۰ نفر</p>

  <div class="box" id="setupBox">
    <label class="lb">اسمت چیه؟</label>
    <input id="nameIn" placeholder="مثلاً: محمدجواد" maxlength="15">
    <label class="lb">شکلت رو انتخاب کن</label>
    <div class="emojis" id="emojiList"></div>
    <button class="btn" id="createBtn">➕ ساخت اتاق جدید (میزبان)</button>
    <button class="btn g" id="joinBtn">🔗 ورود به اتاق (بازیکن)</button>
  </div>

  <div class="box" id="roomBox" style="display:none">
    <div style="font-size:13px;color:var(--mt);text-align:center;margin-bottom:4px">کد اتاق را به دوستانت بده</div>
    <div class="room-code" id="roomCode">----</div>
    
    <div class="players-lobby" id="lobbyPlayers"></div>

    <div id="hostControls">
      <button class="btn gold" id="startBtn" disabled>🚀 شروع بازی</button>
    </div>
    <div id="clientWait" style="display:none;text-align:center;padding:20px">
      <div class="spin" style="margin:0 auto"></div>
      <p style="color:var(--mt);margin-top:12px;font-size:13px">منتظر شروع بازی توسط میزبان…</p>
    </div>
    <button class="btn g" id="leaveBtn" style="margin-top:12px">🚪 خروج</button>
  </div>
</div>

<!-- ============ بازی ============ -->
<div id="game" class="screen">
  <div id="map"></div>
  <div class="hud-top" id="hudTop">
    <div class="hb">🐺 بازی ردیاب</div>
  </div>
  <div class="p-list" id="gamePlayers"></div>
  <div class="floating">
    <button class="fbtn" id="locBtn" title="موقعیت من">📍</button>
    <button class="fbtn" id="exitBtn" title="خروج">🚪</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div><div style="color:var(--mt);font-size:13px" id="loadText">آماده‌سازی…</div></div>

<script>
/* =========================================================
   ابزارها و متغیرها
   ========================================================= */
const $ = s => document.querySelector(s);
const EMOJIS = ["🦊","🐻","🐯","🦁","🐼","🐨","🐵","🐷","🐸","🐙","🦄","🐺","🐢","🐧","🦉","🐲"];

const S = {
  peer: null, isHost: false, roomCode: "", myId: "",
  name: "", emoji: "🦊",
  myPos: null, watchId: null,
  map: null, myMarker: null, playerMarkers: {},
  players: {}, // لیست بازیکنان
  connections: [], // اتصال‌های میزبان
  hostConn: null   // اتصال بازیکن به میزبان
};

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.remove("show"), 3000);
}

function showLoading(txt) { $("#loadText").textContent = txt || "لطفاً صبر کنید..."; $("#loading").classList.add("show"); }
function hideLoading() { $("#loading").classList.remove("show"); }

function esc(s) { return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function haversine(lat1,lng1,lat2,lng2){
  const R=6371000, t=x=>x*Math.PI/180;
  const dLat=t(lat2-lat1), dLng=t(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(t(lat1))*Math.cos(t(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* =========================================================
   ایموجی‌ها
   ========================================================= */
EMOJIS.forEach((em,i)=>{
  const el = document.createElement("div");
  el.className = "em" + (i===0?" sel":"");
  el.textContent = em;
  el.onclick = ()=>{
    document.querySelectorAll(".em").forEach(x=>x.classList.remove("sel"));
    el.classList.add("sel");
    S.emoji = em;
  };
  $("#emojiList").appendChild(el);
});

/* =========================================================
   GPS
   ========================================================= */
function startGPS() {
  if(!navigator.geolocation){ toast("مرورگر شما GPS ندارد"); return; }
  S.watchId = navigator.geolocation.watchPosition(
    pos => {
      S.myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if(!S.map) initMap();
      updateMyMarker();
      sendLocationToNetwork();
    },
    err => { console.warn("GPS:", err); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
}

/* =========================================================
   نقشه
   ========================================================= */
function initMap() {
  S.map = L.map("map", {zoomControl:false, attributionControl:false})
    .setView([S.myPos.lat, S.myPos.lng], 17);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19}).addTo(S.map);
  
  const meIcon = L.divIcon({className:"", html:'<div class="mk-me"></div>', iconSize:[18,18]});
  S.myMarker = L.marker([S.myPos.lat, S.myPos.lng], {icon:meIcon, zIndexOffset:1000}).addTo(S.map);
}

function updateMyMarker() {
  if(S.myMarker && S.myPos) S.myMarker.setLatLng([S.myPos.lat, S.myPos.lng]);
}

function updatePlayerMarkers() {
  if(!S.map) return;
  const seen = new Set();
  Object.entries(S.players).forEach(([id,p])=>{
    if(id === S.myId || !p.lat) return;
    seen.add(id);
    const pos = [p.lat, p.lng];
    const icon = L.divIcon({
      className:"",
      html:`<div class="mk">${p.emoji||"❓"}</div>`,
      iconSize:[30,30], iconAnchor:[15,30]
    });
    if(S.playerMarkers[id]){
      S.playerMarkers[id].setLatLng(pos);
    } else {
      S.playerMarkers[id] = L.marker(pos, {icon}).addTo(S.map).bindPopup(esc(p.name));
    }
  });
  Object.keys(S.playerMarkers).forEach(id=>{
    if(!seen.has(id)){
      S.map.removeLayer(S.playerMarkers[id]);
      delete S.playerMarkers[id];
    }
  });
}

/* =========================================================
   منطق PeerJS (شبکه)
   ========================================================= */
function createPeer(id) {
  return new Promise((resolve, reject) => {
    const peer = new Peer(id, { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });
    peer.on('open', () => resolve(peer));
    peer.on('error', (err) => {
      if(err.type === 'unavailable-id') reject(new Error('این کد قبلاً استفاده شده، دوباره تلاش کن'));
      else reject(err);
    });
  });
}

// ---------- ساخت اتاق (میزبان) ----------
$("#createBtn").onclick = async () => {
  const name = $("#nameIn").value.trim();
  if(name.length < 2){ toast("اسم رو وارد کن"); return; }
  S.name = name; S.isHost = true;

  showLoading("در حال ساخت اتاق...");
  try {
    const code = String(Math.floor(1000 + Math.random() * 9000));
    S.peer = await createPeer('tracker-' + code);
    S.roomCode = code;
    S.myId = "host";
    S.players['host'] = { id: 'host', name: name, emoji: S.emoji, lat: null, lng: null };

    S.peer.on('connection', (conn) => {
      S.connections.push(conn);
      conn.on('open', () => {
        conn.on('data', (data) => handleHostData(conn, data));
        conn.send({ type: 'players', players: Object.values(S.players) });
      });
      conn.on('close', () => {
        const pId = Object.keys(S.players).find(k => S.players[k].conn === conn);
        if(pId){ delete S.players[pId]; broadcastPlayers(); }
        S.connections = S.connections.filter(c => c !== conn);
      });
    });

    $("#roomCode").textContent = code;
    $("#setupBox").style.display = "none";
    $("#roomBox").style.display = "block";
    renderLobby();
    startGPS();
    hideLoading();
  } catch (e) {
    hideLoading();
    toast(e.message);
  }
};

// ---------- ورود به اتاق (بازیکن) ----------
$("#joinBtn").onclick = async () => {
  const name = $("#nameIn").value.trim();
  if(name.length < 2){ toast("اسم رو وارد کن"); return; }
  const code = prompt("کد ۴ رقمی اتاق:");
  if(!code || !/^\d{4}$/.test(code)){ toast("کد باید ۴ رقمی باشه"); return; }

  S.name = name; S.isHost = false; S.roomCode = code;
  S.myId = "p_" + Date.now();

  showLoading("در حال اتصال...");
  try {
    S.peer = await createPeer(); // شناسه تصادفی
    const conn = S.peer.connect('tracker-' + code);
    S.hostConn = conn;

    conn.on('open', () => {
      conn.send({ type: 'join', name: S.name, emoji: S.emoji, id: S.myId });
    });

    conn.on('data', (data) => handleClientData(data));
    conn.on('error', () => toast("خطا در اتصال به اتاق"));

    $("#roomCode").textContent = code;
    $("#setupBox").style.display = "none";
    $("#roomBox").style.display = "block";
    renderLobby();
    startGPS();
    hideLoading();
  } catch (e) {
    hideLoading();
    toast("اتاق پیدا نشد یا میزبان آفلاین است.");
  }
};

// ---------- تبادل داده‌ها ----------
function handleHostData(conn, data) {
  if(data.type === 'join'){
    S.players[data.id] = { id: data.id, name: data.name, emoji: data.emoji, lat: null, lng: null, conn: conn, score: 0, caught: false };
    broadcastPlayers();
    renderLobby();
    toast(data.name + " به اتاق پیوست");
  } else if(data.type === 'location'){
    const p = Object.values(S.players).find(p => p.conn === conn);
    if(p){ p.lat = data.lat; p.lng = data.lng; updatePlayerMarkers(); renderLobby(); }
  }
}

function handleClientData(data) {
  if(data.type === 'players'){
    S.players = {};
    data.players.forEach(p => S.players[p.id] = p);
    renderLobby();
    if(!$("#game").classList.contains("show") && S.isHost === false && data.players.length > 0 && data.state === 'playing'){
      enterGameScreen();
    }
    updateGameUI();
  } else if(data.type === 'game-start'){
    enterGameScreen();
  } else if(data.type === 'kick'){
    location.reload();
  }
}

function broadcastPlayers() {
  const payload = { type: 'players', players: Object.values(S.players), state: S.state || 'lobby' };
  S.connections.forEach(conn => { if(conn.open) conn.send(payload); });
}

function sendLocationToNetwork() {
  if(S.isHost){
    if(S.players['host']){
      S.players['host'].lat = S.myPos.lat;
      S.players['host'].lng = S.myPos.lng;
      broadcastPlayers();
      updatePlayerMarkers();
    }
  } else {
    if(S.hostConn && S.hostConn.open){
      S.hostConn.send({ type: 'location', lat: S.myPos.lat, lng: S.myPos.lng });
    }
  }
}

/* =========================================================
   رابط کاربری
   ========================================================= */
function renderLobby() {
  const list = $("#lobbyPlayers");
  list.innerHTML = "";
  const players = Object.values(S.players);
  
  players.forEach(p=>{
    const d = document.createElement("div");
    d.className = "p-item" + (p.isHost || p.id === 'host' ? " host" : "");
    d.innerHTML = `<div class="av">${p.emoji||"?"}</div>
      <div class="nm">${esc(p.name)}${p.id === S.myId?" (تو)":""}</div>`;
    list.appendChild(d);
  });

  if(S.isHost){
    $("#hostControls").style.display = "block";
    $("#clientWait").style.display = "none";
    $("#startBtn").disabled = players.length < 2;
  } else {
    $("#hostControls").style.display = "none";
    $("#clientWait").style.display = "block";
  }
}

function enterGameScreen() {
  $("#lobby").classList.remove("show");
  $("#game").classList.add("show");
  if(!S.map && S.myPos) initMap();
  updateGameUI();
}

function updateGameUI() {
  const list = $("#gamePlayers");
  if(!list) return;
  list.innerHTML = "";
  
  const me = S.players[S.myId];
  if(me){
    const d = document.createElement("div");
    d.className = "p-card me";
    d.innerHTML = `<div class="ic">${me.emoji||"?"}</div><div class="in"><div class="nn">${esc(me.name)} (تو)</div></div>`;
    list.appendChild(d);
  }

  Object.values(S.players).forEach(p=>{
    if(p.id === S.myId || !p.lat) return;
    const d = document.createElement("div");
    d.className = "p-card";
    const dist = S.myPos ? Math.round(haversine(S.myPos.lat, S.myPos.lng, p.lat, p.lng)) + " متر" : "...";
    d.innerHTML = `<div class="ic">${p.emoji||"?"}</div><div class="in"><div class="nn">${esc(p.name)}</div><div class="ds">${dist}</div></div>`;
    list.appendChild(d);
  });
  
  updatePlayerMarkers();
}

/* =========================================================
   دکمه‌ها
   ========================================================= */
$("#startBtn").onclick = () => {
  S.state = 'playing';
  // ارسال پیام شروع به همه
  S.connections.forEach(conn => { if(conn.open) conn.send({ type: 'game-start' }); });
  broadcastPlayers();
  enterGameScreen();
};

$("#leaveBtn").onclick = () => {
  if(confirm("از اتاق خارج می‌شوی؟")) location.reload();
};

$("#exitBtn").onclick = () => {
  if(confirm("از بازی خارج می‌شوی؟")) location.reload();
};

$("#locBtn").onclick = () => {
  if(S.map && S.myPos) S.map.setView([S.myPos.lat, S.myPos.lng], 18, {animate:true});
};
</script>
</body>
</html>
